{% extends "base.html" %}
{% from "_macros.html" import vehicle_select %}
{% block title %}Registrace{% endblock %}
{% block content %}
<section class="narrow">
  <h1>Registrace</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field" for="r-user"><span>Uživatelské jméno</span>
      <input id="r-user" name="username" value="{{ form.username }}" required minlength="3" maxlength="32" autocomplete="username"></label>
    <label class="field" for="r-pass"><span>Heslo, aspoň 8 znaků</span>
      <input id="r-pass" type="password" name="password" required minlength="8" autocomplete="new-password"></label>
    <label class="field" for="r-pass2"><span>Heslo znovu</span>
      <input id="r-pass2" type="password" name="password_again" required minlength="8" autocomplete="new-password"></label>
    <label class="field" for="r-vehicle"><span>Vaše vozidlo</span>{{ vehicle_select(models, form.vehicle_model_id, 'r-vehicle') }}</label>
    <p class="note">Vozidlo se předvyplní do rezervací. Podle jeho nabíjecího výkonu poznáme, na která rychlá stání může.</p>
    <div><button class="btn">Vytvořit účet</button></div>
  </form>
</section>
{% endblock %}
