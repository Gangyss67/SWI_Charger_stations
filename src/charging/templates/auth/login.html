{% extends "base.html" %}
{% block title %}Přihlášení{% endblock %}
{% block content %}
<section class="card form-card narrow">
  <h1>Přihlášení</h1>
  <form method="post" class="form-col">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Uživatelské jméno <input name="username" value="{{ username }}" required autofocus autocomplete="username"></label>
    <label>Heslo <input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn">Přihlásit</button>
  </form>
  <p class="muted">Nemáte účet? <a href="{{ url_for('auth.register') }}">Zaregistrujte se.</a></p>
</section>
{% endblock %}
